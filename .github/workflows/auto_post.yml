name: YouTube to Facebook Auto-Post

on:
  schedule:
    - cron: '0 * * * *'  # Kay-khdm kol sa3a automatic
  workflow_dispatch:      # Kay-khllik t-testih manual

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # ⚠️ HAD L-PARTIE MHEMMA: Bach GitHub Actions y9dr y-sajjel posted_videos.txt
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/python-version@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Post Script
      env:
        YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: |
        python main.py

    - name: Commit and Push updated posted_videos.txt
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add posted_videos.txt
        git commit -m "Auto-update posted videos list" || exit 0
        git push origin main
