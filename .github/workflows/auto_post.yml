name: YouTube to Facebook Auto-Post

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Kol sa3a

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests yt-dlp google-genai youtube-transcript-api

      - name: Run Auto Post Script
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit and Push updated posted_videos.txt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update posted_videos.txt"
          file_pattern: "posted_videos.txt"
